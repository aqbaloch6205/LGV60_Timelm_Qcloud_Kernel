name: Build Jhat-Pat Kernel (Next Gen 2.0)

on:
  workflow_dispatch:
    inputs:
      include_ksu:
        description: 'Include KernelSU?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - name: Cleanup Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3 tar

    - name: Set short commit SHA
      id: vars
      run: echo "SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_ENV

    - name: Cache ccache
      uses: actions/cache@v5
      with:
        path: ~/.cache/ccache_mikernel
        key: ${{ runner.os }}-ccache-v60-${{ github.event.inputs.include_ksu }}-${{ env.SHORT_SHA }}
        restore-keys: |
          ${{ runner.os }}-ccache-v60-${{ github.event.inputs.include_ksu }}-
          ${{ runner.os }}-ccache-v60-

    - name: Setup zyc-clang toolchain (ZyC-Clang 16)
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        # Swapped to the exact ZyC-Clang 16 toolchain used by the Xiaomi developer
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/Clang-16.0.6-20260510.tar.gz
        tar -zxvf Clang-16.0.6-20260510.tar.gz
        cd $GITHUB_WORKSPACE

    - name: Build kernel
      run: |
        # Exporting path for the toolchain
        export PATH="$HOME/zyc-clang/bin:$PATH"
        if [ "${{ github.event.inputs.include_ksu }}" = "true" ]; then
          bash kernel.sh ksu
        else
          bash kernel.sh
        fi

    - name: Show ccache stats
      run: ccache -s

    - name: Upload build artifacts
      uses: actions/upload-artifact@v6
      with:
        name: LMV600${{ github.event.inputs.include_ksu == 'true' && '-KSU-SuSFS' || '-SuSFS' }}-Kernel
        path: |
          *.zip
          out/arch/arm64/boot/Image*
          out/arch/arm64/boot/dtb*
          out/arch/arm64/boot/dts/vendor/*.dtb
        if-no-files-found: error
