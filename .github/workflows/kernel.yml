name: LG SM8250 Kernel Build (ZyCromerZ Mimic)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04 # Use 22.04 to match the Xiaomi builder

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3 tar

    - name: Setup ZyC Clang Toolchain
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        # Using the specific version from your Xiaomi example
        wget https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20251111-release/Clang-15.0.7-20251111.tar.gz
        tar -zxvf Clang-15.0.7-20251111.tar.gz

    - name: Build Kernel
      env:
        # Mimicking the bash script identity
        KBUILD_BUILD_USER: "QcloudFx"
        KBUILD_BUILD_HOST: "Abdul-Qadeer"
        PATH: ${{ home }}/zyc-clang/bin:/usr/bin:/bin
      run: |
        # Variables from your .sh logic
        export ARCH=arm64
        export SUBARCH=ARM64
        DEFCONFIG="vendor/arabella_defconfig"
        
        # 1. Clean
        make O=out ARCH=arm64 clean
        make O=out ARCH=arm64 mrproper
        
        # 2. Initialize Config
        make O=out ARCH=arm64 $DEFCONFIG
        
        # 3. Compile (Mimicking the .sh exactly)
        # We use the full LLVM=1 suite which ZyC Clang supports perfectly.
        # This avoids the "libc.so.6" error by using the integrated LLVM tools.
        make -j$(nproc) O=out \
             ARCH=arm64 \
             CC=clang \
             NM=llvm-nm \
             OBJCOPY=llvm-objcopy \
             OBJDUMP=llvm-objdump \
             STRIP=llvm-strip \
             CROSS_COMPILE=aarch64-linux-gnu- \
             CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
             LLVM=1 \
             LLVM_IAS=1

    - name: Upload Everything Generated
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Output-LMV600
        path: |
          out/arch/arm64/boot/Image*
          out/arch/arm64/boot/*.img
          out/arch/arm64/boot/dts/vendor/*.dtb
          
