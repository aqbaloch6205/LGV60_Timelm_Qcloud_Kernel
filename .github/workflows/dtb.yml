name: Clone and Zip LGE Vendor

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Install necessary tools to ensure they are available and up to date
      - name: Install System Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip

      # 2. Clone the external repository (Only the finalwork branch)
      - name: Clone External Kernel Repo
        run: |
          git clone --depth 1 --branch finalwork https://github.com/rofikkerneldev/lgv60nextgen_rofikkernel.git kernel_dir

      # 3. Create the Zip file of only the target folder
      - name: Zip LGE Folder
        run: |
          # Define the specific internal path
          TARGET="kernel_dir/arch/arm64/boot/dts/vendor/lge"
          
          if [ -d "$TARGET" ]; then
            echo "Path exists. Starting compression..."
            # -j flag flattens the directory structure if you only want the files
            # Remove -j if you want to keep the full internal folder path
            zip -r lge_vendor_boot.zip "$TARGET"
          else
            echo "Error: Path $TARGET not found in the repository!"
            exit 1
          fi

      # 4. Upload the zip as a downloadable artifact
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: LGE-Vendor-DTS
          path: lge_vendor_boot.zip
          retention-days: 5
          
